resource:
    name: Checkout
    shortName: checkout
    description: 'Place an order for an authenticated customer or guest checkout.'

    processor: Spryker\Glue\CheckoutRestApi\Api\Storefront\Processor\CheckoutStorefrontProcessor

    security: "is_granted('CUSTOMER_ACCESS') and is_granted('ROLE_CUSTOMER')"
    securityAnonymousAuthRequired: true

    operations:
        - type: Post
          uriTemplate: '/checkout'
          description: 'Place an order for the cart identified by `idCart`.'
          normalizationContext:
              gen_id: false
          openapiContext:
              responses:
                  201:
                      description: 'Order placed.'
                  400:
                      description: 'Neither an access token nor an anonymous customer identifier was provided.'
                  401:
                      description: 'Unauthenticated: the access token is invalid or expired.'
                  422:
                      description: 'Unprocessable request: invalid payload, or the order could not be placed.'

    includes:
        - relationshipName: orders
          targetResource: Orders
          uriVariableMappings:
              orderReferences: orderReference

    properties:
        checkoutId:
            type: string
            identifier: true
            syntheticIdentifier: true
            writable: false
            readable: false
            required: false
            description: 'Synthetic identifier; never serialized.'
            openapiContext:
                example: '0'

        idCart:
            type: string
            writable: true
            readable: false
            required: false
            description: 'UUID of the cart to be used for checkout.'
            openapiContext:
                example: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'

        customer:
            type: object
            objectName: Customer
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Customer data for the checkout.'
            properties:
                salutation:
                    type: string
                    description: 'Customer salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    description: 'Customer first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Customer last name.'
                    openapiContext:
                        example: 'Doe'
                email:
                    type: string
                    description: 'Customer email address.'
                    openapiContext:
                        example: 'john.doe@example.com'

        billingAddress:
            type: object
            objectName: Address
            synthesizeMissingFieldsWhenEmpty: true
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Billing address for the order.'
            properties:
                id:
                    type: string
                    description: 'Identifier of an existing customer address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                idCompanyBusinessUnitAddress:
                    type: string
                    description: 'Identifier of a company business unit address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                salutation:
                    type: string
                    description: 'Address salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    description: 'Address first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Address last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    description: 'Street name.'
                    openapiContext:
                        example: 'Main Street'
                address2:
                    type: string
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    description: 'Additional address line.'
                    openapiContext:
                        example: 'third. address. line'
                zipCode:
                    type: string
                    description: 'ZIP code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                iso2Code:
                    type: string
                    description: 'ISO 2 country code.'
                    openapiContext:
                        example: 'DE'
                company:
                    type: string
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                phone:
                    type: string
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 123456'
                email:
                    type: string
                    description: 'Email address.'
                    openapiContext:
                        example: 'john.doe@example.com'

        shippingAddress:
            type: object
            objectName: Address
            synthesizeMissingFieldsWhenEmpty: true
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Shipping address for the order.'
            properties:
                id:
                    type: string
                    description: 'Identifier of an existing customer address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                idCompanyBusinessUnitAddress:
                    type: string
                    description: 'Identifier of a company business unit address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                salutation:
                    type: string
                    description: 'Address salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    description: 'Address first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Address last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    description: 'Street name.'
                    openapiContext:
                        example: 'Main Street'
                address2:
                    type: string
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    description: 'Additional address line.'
                    openapiContext:
                        example: 'third. address. line'
                zipCode:
                    type: string
                    description: 'ZIP code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                iso2Code:
                    type: string
                    description: 'ISO 2 country code.'
                    openapiContext:
                        example: 'DE'
                company:
                    type: string
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                phone:
                    type: string
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 123456'
                email:
                    type: string
                    description: 'Email address.'
                    openapiContext:
                        example: 'john.doe@example.com'

        payments:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Payment details for the order.'
            openapiContext:
                example:
                    - paymentMethodName: 'invoice'
                      paymentProviderName: 'DummyPayment'

        shipment:
            type: object
            objectName: CheckoutShipment
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Single-shipment details for the order.'
            properties:
                idShipmentMethod:
                    type: integer
                    description: 'Shipment method identifier.'
                    openapiContext:
                        example: 1

        shipments:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Split-shipment details for the order.'
            openapiContext:
                example:
                    - items: ['c4ca4238a0b923820dcc509a6f75849b']
                      shippingAddress:
                          salutation: 'Mr'
                          firstName: 'John'
                          lastName: 'Doe'
                          address1: 'Main Street'
                          zipCode: '10115'
                          city: 'Berlin'
                          iso2Code: 'DE'
                      idShipmentMethod: 1
                      requestedDeliveryDate: null

        items:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'List of item identifiers for single-shipment checkout.'
            openapiContext:
                example:
                    - 'c4ca4238a0b923820dcc509a6f75849b'

        servicePoints:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Service-point assignments per item group.'
            openapiContext:
                example:
                    - idServicePoint: '3fec586e-92f6-5692-a98b-dfca29cd2e16'
                      items: ['c4ca4238a0b923820dcc509a6f75849b']

        orderReference:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Unique reference identifier for the placed order.'
            openapiContext:
                example: 'DE--1'

        # Feeds the `orders` relationship as a JSON:API to-many array (legacy contract emits
        # `relationships.orders.data[0]` even for a single placed order). Not part of the response body.
        orderReferences:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Order references for the `orders` relationship.'

        redirectUrl:
            type: string
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'URL the user should be redirected to after order placement. Set by a payment method that hands the customer to an external provider; a method that settles in place - invoice, for instance - answers none.'
            openapiContext:
                example: 'https://payment-provider.example.com/redirect'

        isExternalRedirect:
            type: boolean
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'Flag indicating whether the redirect points to an external URL. Set alongside `redirectUrl` by a payment method that redirects, and absent with it when the method settles in place.'
            openapiContext:
                example: false
