resource:
    name: CheckoutData
    shortName: checkout-data
    description: 'Provide checkout data — available addresses, shipment methods, payment methods.'

    processor: Spryker\Glue\CheckoutRestApi\Api\Storefront\Processor\CheckoutDataStorefrontProcessor

    security: "is_granted('CUSTOMER_ACCESS') and is_granted('ROLE_CUSTOMER')"
    securityAnonymousAuthRequired: true

    operations:
        - type: Post
          status: 200
          uriTemplate: '/checkout-data'
          description: 'Retrieve checkout data including available payment and shipment methods.'
          normalizationContext:
              gen_id: false
          openapiContext:
              responses:
                  200:
                      description: 'Checkout data returned.'
                  400:
                      description: 'Neither an access token nor an anonymous customer identifier was provided.'
                  401:
                      description: 'Unauthenticated: the access token is invalid or expired.'
                  422:
                      description: 'Unprocessable request: invalid payload, or the checkout data could not be read.'

    includes:
        - relationshipName: shipments
          targetResource: Shipments
          resolverClass: Spryker\Glue\ShipmentsRestApi\Api\Storefront\Relationship\CheckoutDataShipmentsRelationshipResolver
        - relationshipName: shipment-methods
          targetResource: ShipmentMethods
          resolverClass: Spryker\Glue\ShipmentsRestApi\Api\Storefront\Relationship\CheckoutDataShipmentMethodsRelationshipResolver
        - relationshipName: shipment-types
          targetResource: ShipmentTypes
          resolverClass: Spryker\Glue\CheckoutRestApi\Api\Storefront\Relationship\CheckoutDataShipmentTypesRelationshipResolver
        - relationshipName: company-business-unit-addresses
          targetResource: CompanyBusinessUnitAddresses
          uriVariableMappings:
              companyBusinessUnitAddressUuids: uuid
        - relationshipName: service-points
          targetResource: ServicePoints
          resolverClass: Spryker\Glue\CheckoutRestApi\Api\Storefront\Relationship\CheckoutDataServicePointsRelationshipResolver
        - relationshipName: addresses
          targetResource: CustomersAddresses
          resolverClass: Spryker\Glue\CustomersRestApi\Api\Storefront\Relationship\CheckoutDataAddressesRelationshipResolver
        - relationshipName: carts
          targetResource: Carts
          uriTemplate: /carts/{uuid}
          uriVariableMappings:
              cartUuid: uuid
        - relationshipName: guest-carts
          targetResource: GuestCarts
          uriTemplate: /guest-carts/{uuid}
          uriVariableMappings:
              guestCartUuid: uuid
        - relationshipName: payment-methods
          targetResource: PaymentMethods
          resolverClass: Spryker\Glue\PaymentsRestApi\Api\Storefront\Relationship\CheckoutDataPaymentMethodsRelationshipResolver

    properties:
        checkoutDataId:
            type: string
            identifier: true
            syntheticIdentifier: true
            writable: false
            readable: false
            required: false
            description: 'Synthetic identifier; never serialized.'
            openapiContext:
                example: '0'

        idCart:
            type: string
            writable: true
            readable: false
            required: false
            description: 'UUID of the cart to retrieve checkout data for.'
            openapiContext:
                example: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'

        customer:
            type: object
            objectName: Customer
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Customer data for the checkout.'
            properties:
                salutation:
                    type: string
                    description: 'Customer salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    description: 'Customer first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Customer last name.'
                    openapiContext:
                        example: 'Doe'
                email:
                    type: string
                    description: 'Customer email address.'
                    openapiContext:
                        example: 'john.doe@example.com'

        billingAddress:
            type: object
            objectName: Address
            synthesizeMissingFieldsWhenEmpty: true
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Billing address for the order.'
            properties:
                id:
                    type: string
                    description: 'Identifier of an existing customer address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                idCompanyBusinessUnitAddress:
                    type: string
                    description: 'Identifier of a company business unit address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                salutation:
                    type: string
                    description: 'Address salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    description: 'Address first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Address last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    description: 'Street name.'
                    openapiContext:
                        example: 'Main Street'
                address2:
                    type: string
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    description: 'Additional address line.'
                    openapiContext:
                        example: 'third. address. line'
                zipCode:
                    type: string
                    description: 'ZIP code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                iso2Code:
                    type: string
                    description: 'ISO 2 country code.'
                    openapiContext:
                        example: 'DE'
                company:
                    type: string
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                phone:
                    type: string
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 123456'
                email:
                    type: string
                    description: 'Email address.'
                    openapiContext:
                        example: 'john.doe@example.com'

        shippingAddress:
            type: object
            objectName: Address
            synthesizeMissingFieldsWhenEmpty: true
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Shipping address for the order.'
            properties:
                id:
                    type: string
                    description: 'Identifier of an existing customer address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                idCompanyBusinessUnitAddress:
                    type: string
                    description: 'Identifier of a company business unit address to reuse; when set the other fields may be omitted.'
                    openapiContext:
                        example: '1a2b3c'
                salutation:
                    type: string
                    description: 'Address salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    description: 'Address first name.'
                    openapiContext:
                        example: 'John'
                lastName:
                    type: string
                    description: 'Address last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    description: 'Street name.'
                    openapiContext:
                        example: 'Main Street'
                address2:
                    type: string
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    description: 'Additional address line.'
                    openapiContext:
                        example: 'third. address. line'
                zipCode:
                    type: string
                    description: 'ZIP code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                iso2Code:
                    type: string
                    description: 'ISO 2 country code.'
                    openapiContext:
                        example: 'DE'
                company:
                    type: string
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                phone:
                    type: string
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 123456'
                email:
                    type: string
                    description: 'Email address.'
                    openapiContext:
                        example: 'john.doe@example.com'

        payments:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Payment details for the order.'
            openapiContext:
                example:
                    - paymentMethodName: 'invoice'
                      paymentProviderName: 'DummyPayment'

        shipment:
            type: object
            objectName: CheckoutShipment
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Single-shipment details for the order.'
            properties:
                idShipmentMethod:
                    type: integer
                    description: 'Shipment method identifier.'
                    openapiContext:
                        example: 1

        shipments:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Split-shipment details for the order.'
            openapiContext:
                example:
                    - items: ['c4ca4238a0b923820dcc509a6f75849b']
                      shippingAddress:
                          salutation: 'Mr'
                          firstName: 'John'
                          lastName: 'Doe'
                          address1: 'Main Street'
                          zipCode: '10115'
                          city: 'Berlin'
                          iso2Code: 'DE'
                      idShipmentMethod: 1
                      requestedDeliveryDate: null

        items:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'List of item identifiers for single-shipment checkout.'
            openapiContext:
                example:
                    - 'c4ca4238a0b923820dcc509a6f75849b'

        servicePoints:
            type: array
            nullable: true
            writable: true
            readable: false
            required: false
            description: 'Service-point assignments per item group.'
            openapiContext:
                example:
                    - idServicePoint: '3fec586e-92f6-5692-a98b-dfca29cd2e16'
                      items: ['c4ca4238a0b923820dcc509a6f75849b']

        addresses:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Available customer addresses.'
            openapiContext:
                example:
                    - id: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'
                      salutation: 'Mr'
                      firstName: 'John'
                      lastName: 'Doe'
                      address1: 'Main Street'
                      address2: '1'
                      zipCode: '10115'
                      city: 'Berlin'
                      country: 'Germany'
                      iso2Code: 'DE'
                      phone: '+49 30 123456'
                      isDefaultBilling: true
                      isDefaultShipping: true

        paymentProviders:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Available payment providers with their methods.'
            openapiContext:
                example:
                    - paymentProviderName: 'DummyPayment'
                      paymentMethods:
                          - paymentMethodName: 'invoice'
                            paymentProviderName: 'DummyPayment'
                            requiredRequestData:
                                - 'paymentMethod'
                                - 'paymentProvider'

        shipmentMethods:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Available shipment methods.'
            openapiContext:
                example:
                    - id: 1
                      name: 'Standard'
                      carrierName: 'Spryker Dummy Shipment'
                      price: 490
                      taxRate: 19
                      shipmentType: 'delivery'
                      currencyIsoCode: 'EUR'

        selectedShipmentMethods:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Currently selected shipment methods.'
            openapiContext:
                example:
                    - id: 1
                      name: 'Standard'
                      carrierName: 'Spryker Dummy Shipment'
                      price: 490
                      taxRate: 19
                      shipmentType: 'delivery'
                      currencyIsoCode: 'EUR'

        selectedPaymentMethods:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Currently selected payment methods.'
            openapiContext:
                example:
                    - paymentMethodName: 'invoice'
                      paymentProviderName: 'DummyPayment'

        selectedShipmentTypes:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Currently selected shipment types per item.'
            openapiContext:
                example:
                    - idShipmentType: 1
                      name: 'Delivery'
                      key: 'delivery'

        selectedServicePoints:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Currently selected service points per item group.'
            openapiContext:
                example:
                    - idServicePoint: '3fec586e-92f6-5692-a98b-dfca29cd2e16'
                      items: ['c4ca4238a0b923820dcc509a6f75849b']

        shipmentGroupContexts:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Serialized `ShipmentGroupTransfer` arrays; consumed by `\Spryker\Glue\ShipmentsRestApi\Api\Storefront\Relationship\CheckoutDataShipmentsRelationshipResolver` to assemble `shipments` resources.'

        shipmentMethodContexts:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Serialized `ShipmentMethodTransfer` arrays (deduped by id); consumed by `\Spryker\Glue\ShipmentsRestApi\Api\Storefront\Relationship\CheckoutDataShipmentMethodsRelationshipResolver` to assemble `shipment-methods` resources.'

        shipmentTypesRelationshipData:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Pre-computed shipment types; consumed by `CheckoutDataShipmentTypesRelationshipResolver`.'

        servicePointsRelationshipData:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Pre-computed service points; consumed by `CheckoutDataServicePointsRelationshipResolver`.'

        addressesRelationshipData:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Raw customer address rows feeding the `addresses` relationship; consumed by `CheckoutDataAddressesRelationshipResolver`. Not part of the JSON:API response body (the `addresses` attribute carries the inline copy).'

        cartUuid:
            type: string
            nullable: true
            writable: false
            readable: false
            required: false
            description: 'Quote UUID feeding the `carts` relationship for authorised customers (null for guests). Internal only — not part of the JSON:API response body.'

        guestCartUuid:
            type: string
            nullable: true
            writable: false
            readable: false
            required: false
            description: 'Quote UUID feeding the `guest-carts` relationship for guests (null for authorised customers). Internal only — not part of the JSON:API response body.'

        paymentMethodsRelationshipData:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Raw available payment-method rows feeding the `payment-methods` relationship; consumed by `CheckoutDataPaymentMethodsRelationshipResolver`. Not part of the JSON:API response body.'

        companyBusinessUnitAddressUuids:
            type: array
            writable: false
            readable: false
            required: false
            description: 'UUIDs of company business unit addresses, fanned out into the `company-business-unit-addresses` include via array URI variable mapping.'
